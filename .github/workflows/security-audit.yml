name: Dependency Security Audit
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate dependency vulnerability reports
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-production.json || true
          npm audit --json > audit-all.json || true
      - name: Summarize vulnerabilities in Actions run
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const out = ['# RAVZEN Dependency Security Audit', ''];
          for (const [label, file] of [['Production dependencies', 'audit-production.json'], ['All dependencies', 'audit-all.json']]) {
            try {
              const audit = JSON.parse(fs.readFileSync(file, 'utf8'));
              const counts = audit.metadata?.vulnerabilities || {};
              out.push('## ' + label, '');
              out.push('Critical: ' + (counts.critical || 0) + ' | High: ' + (counts.high || 0) + ' | Moderate: ' + (counts.moderate || 0) + ' | Low: ' + (counts.low || 0), '');
              out.push('| Package | Severity | Direct | Fix available |', '|---|---|---|---|');
              for (const [name, issue] of Object.entries(audit.vulnerabilities || {}).sort((a,b) => ({critical:4,high:3,moderate:2,low:1}[b[1].severity]||0)-({critical:4,high:3,moderate:2,low:1}[a[1].severity]||0))) {
                const fix = issue.fixAvailable === false ? 'No' : issue.fixAvailable === true ? 'Yes' : issue.fixAvailable?.name ? issue.fixAvailable.name + '@' + issue.fixAvailable.version : 'Unknown';
                out.push('| ' + name.replace(/[|]/g,'') + ' | ' + issue.severity + ' | ' + (issue.isDirect?'Yes':'No') + ' | ' + String(fix).replace(/[|]/g,'') + ' |');
              }
              out.push('');
            } catch (error) { out.push('Audit report could not be parsed: ' + String(error), ''); }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join('\n') + '\n');
          NODE
      - name: Upload vulnerability reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: |
            audit-production.json
            audit-all.json
          retention-days: 14
      - name: Enforce production security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Enforce full dependency security gate
        if: always()
        run: npm audit --audit-level=high
