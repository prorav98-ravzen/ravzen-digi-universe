name: Security Remediation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-remediation.yml'
permissions:
  contents: write
jobs:
  patch-dependencies:
    runs-on: ubuntu-latest
    concurrency:
      group: security-remediation-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update Next.js security patch without a major upgrade
        run: npm install --save-exact next@15.5.29 eslint-config-next@15.5.29
      - name: Fix compatible dependency vulnerabilities
        run: npm audit fix
      - name: Verify reproducible installation
        run: npm ci
      - name: Verify TypeScript
        run: npm run type-check
      - name: Verify production build
        run: npm run build
      - name: Generate remaining security audit reports
        if: always()
        shell: bash
        run: |
          npm audit --omit=dev --json > audit-production.json || true
          npm audit --json > audit-all.json || true
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-remediation-audit
          path: |
            audit-production.json
            audit-all.json
      - name: Enforce high and critical vulnerability gate
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Commit verified dependency patches to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required"
          else
            git commit -m "security: apply verified compatible dependency patches"
            git push origin HEAD:main
          fi
