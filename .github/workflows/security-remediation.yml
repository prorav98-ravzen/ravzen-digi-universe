name: Security Remediation PR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-remediation.yml'
permissions:
  contents: write
  pull-requests: write
jobs:
  patch-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade Next.js within the current major version
        run: npm install --save-exact next@15.5.29 eslint-config-next@15.5.29
      - name: Apply compatible npm security patches
        run: npm audit fix || true
      - name: Verify lockfile reproducibility
        run: npm ci
      - name: Typecheck
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Generate remaining vulnerability report
        run: npm audit --json > remaining-audit.json || true
      - name: Upload remaining vulnerability report
        uses: actions/upload-artifact@v4
        with:
          name: remaining-security-findings
          path: remaining-audit.json
      - name: Open reviewed dependency remediation PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: security/patch-dependencies
          delete-branch: true
          title: 'security: patch Next.js and compatible vulnerable dependencies'
          commit-message: 'security: patch Next.js and compatible vulnerable dependencies'
          body: |
            Updates Next.js and eslint-config-next to 15.5.29 and applies compatible npm audit fixes.
            Generated package-lock.json is committed with package.json.
            CI runs npm ci, type-check and production build before opening this PR.
            Review the remaining audit artifact and verify production behavior before merging.
          add-paths: |
            package.json
            package-lock.json
